sources:
  - type: maven
    path: pom.xml
    modules:
      - maven_central
linkReplacements:
  - "https://github.com/google/guava/guava|https://github.com/google/guava"
  - "http://wiki.fasterxml.com/JacksonModuleScala|https://github.com/FasterXML/jackson-module-scala"
  - "http://nexus.sonatype.org/oss-repository-hosting.html|https://www.scalatest.org/user_guide/using_the_scalatest_maven_plugin"
  - "http://nexus.sonatype.org/oss-repository-hosting.html/scalatest-maven-plugin|https://www.scalatest.org/user_guide/using_the_scalatest_maven_plugin"
build:
  workflows:
    - name: ci-build.yml
      stepCustomizations:
        - action: INSERT_AFTER
          job: build-and-test
          stepId: setup-java
          content:
            name: Run scalafix linting
            id: run-scalafix-linting
            # Running tests is required here to avoid linter error
            # "error: SemanticDB not found: src/main/scala/com/exasol/common/file/BucketFSFileChecker.scala"
            run: mvn --batch-mode clean compile test scalafix:scalafix
    - name: release.yml
      stepCustomizations:
        - action: INSERT_AFTER
          stepId: build
          content:
            name: Prepare Maven Central Release
            id: prepare-maven-central-release
            run: |
              sudo apt install -y --no-install-recommends xmlstarlet
              ./.github/workflows/createReleasePom.sh
